spring.application.name=compras
server.port=${SERVER_PORT:8083}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/offbeat_compras?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:offbeat}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:offbeatpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

usuarios.service.url=${USUARIOS_SERVICE_URL:http://localhost:8082}
productos.service.url=${PRODUCTOS_SERVICE_URL:http://localhost:8081}